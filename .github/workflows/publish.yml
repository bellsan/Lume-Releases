name: Publish Lume Pro
on:
  push:
    branches: [main]
    paths: [publish.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lume-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and stage package
        run: python3 scripts/validate_package.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("publish.json"))["version"])')
          tag="v$version"
          archive="packages/LumePro-$version.zip"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/lume-draft 2>/dev/null; then
            if [[ $(cat /tmp/lume-draft) != true ]]; then
              echo "Release already published; will not overwrite."
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Lume Pro $tag" --notes-file /tmp/lume-release-notes.md
          fi
          gh release upload "$tag" "$archive" "/tmp/LumePro-$version.zip.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
